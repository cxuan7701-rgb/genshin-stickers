
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111318">
    <title>原神貼圖圖庫</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="language-box">
            <select id="languageSelect" class="language-select">
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </div>

        <h1 data-i18n="title">原神貼圖圖庫</h1>
        <p class="subtitle" data-i18n="subtitle">
            收藏喜歡的角色貼圖
        </p>

        <div class="top-actions">
            <button class="action-pill" id="homeBtn" data-i18n="home">
                📲 桌面 App
            </button>
            <button class="action-pill" id="shortcutBtn" data-i18n="shortcut">
                ⚡ 安裝捷徑
            </button>
            <button class="action-pill" id="guideBtn" data-i18n="guide">
                📖 貼圖教學
            </button>
        </div>
    </header>

    <main class="main-container">
        <section class="category-section">
            <h2 data-i18n="categories">貼圖分類</h2>
            <div id="categoryList" class="category-list">
                <div class="loading" data-i18n="loading">載入中...</div>
            </div>
        </section>

        <section id="gallerySection" class="gallery-section hidden">
            <div class="gallery-header">
                <button id="backBtn" class="back-button" data-i18n="back">
                    ← 返回分類
                </button>
                <h2 id="folderTitle">分類名稱</h2>
            </div>

            <div id="imageGrid" class="image-grid"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <div id="imageModal" class="image-modal hidden">
        <button id="closeModal" class="modal-close">✕</button>
        <img id="modalImage" src="" alt="貼圖預覽">
        <button id="downloadBtn" class="download-button" data-i18n="download">
            ⚡ 使用捷徑下載
        </button>
    </div>

    <script>
        // ==============================
        // GitHub 設定
        // ==============================

        const GITHUB_USERNAME = "cxuan7701-rgb";
        const REPO_NAME = "genshin-stickers";
        const BRANCH_NAME = "main";

        const SHORTCUT_URL =
            "https://www.icloud.com/shortcuts/379f4f786fda49e58fb70cd6b5c405cf";

        const SHORTCUT_NAME = "一鍵下載貼圖";

        // ==============================
        // 多語言設定
        // ==============================

        const translations = {
            "zh-TW": {
                title: "原神貼圖圖庫",
                subtitle: "收藏喜歡的角色貼圖",
                home: "📲 桌面 App",
                shortcut: "⚡ 安裝捷徑",
                guide: "📖 貼圖教學",
                categories: "貼圖分類",
                loading: "載入中...",
                back: "← 返回分類",
                download: "⚡ 使用捷徑下載",
                empty: "目前沒有圖片",
                error: "載入失敗，請稍後再試",
                copied: "已準備好下載",
                select: "選擇貼圖"
            },
            "zh-CN": {
                title: "原神表情包图库",
                subtitle: "收藏喜欢的角色表情包",
                home: "📲 桌面应用",
                shortcut: "⚡ 安装捷径",
                guide: "📖 表情包教程",
                categories: "表情包分类",
                loading: "加载中...",
                back: "← 返回分类",
                download: "⚡ 使用捷径下载",
                empty: "目前没有图片",
                error: "加载失败，请稍后再试",
                copied: "已准备好下载",
                select: "选择表情包"
            },
            "en": {
                title: "Genshin Stickers",
                subtitle: "Collect your favorite character stickers",
                home: "📲 Home App",
                shortcut: "⚡ Shortcut",
                guide: "📖 Guide",
                categories: "Categories",
                loading: "Loading...",
                back: "← Back",
                download: "⚡ Download with Shortcut",
                empty: "No images found",
                error: "Loading failed. Please try again.",
                copied: "Ready to download",
                select: "Select a sticker"
            },
            "ja": {
                title: "原神スタンプギャラリー",
                subtitle: "お気に入りのキャラクターを集めよう",
                home: "📲 ホーム追加",
                shortcut: "⚡ ショートカット",
                guide: "📖 使い方",
                categories: "カテゴリー",
                loading: "読み込み中...",
                back: "← 戻る",
                download: "⚡ ショートカットで保存",
                empty: "画像がありません",
                error: "読み込みに失敗しました",
                copied: "ダウンロード準備完了",
                select: "スタンプを選択"
            },
            "ko": {
                title: "원신 스티커 갤러리",
                subtitle: "좋아하는 캐릭터 스티커 모음",
                home: "📲 홈 화면 추가",
                shortcut: "⚡ 단축어",
                guide: "📖 사용법",
                categories: "카테고리",
                loading: "불러오는 중...",
                back: "← 돌아가기",
                download: "⚡ 단축어로 다운로드",
                empty: "이미지가 없습니다",
                error: "불러오기에 실패했습니다",
                copied: "다운로드 준비 완료",
                select: "스티커 선택"
            }
        };

        let currentLanguage =
            localStorage.getItem("genshinLanguage") || "zh-TW";

        let currentFolder = "";
        let selectedImageUrl = "";

        const categoryList = document.getElementById("categoryList");
        const imageGrid = document.getElementById("imageGrid");
        const gallerySection = document.getElementById("gallerySection");
        const folderTitle = document.getElementById("folderTitle");
        const imageModal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");
        const toast = document.getElementById("toast");

        // ==============================
        // 語言切換
        // ==============================

        function applyLanguage() {
            const language = translations[currentLanguage];

            document.documentElement.lang = currentLanguage;

            document.querySelectorAll("[data-i18n]").forEach(element => {
                const key = element.dataset.i18n;

                if (language[key]) {
                    element.textContent = language[key];
                }
            });

            document.getElementById("languageSelect").value =
                currentLanguage;

            if (currentFolder) {
                folderTitle.textContent = currentFolder;
            }
        }

        document.getElementById("languageSelect")
            .addEventListener("change", event => {
                currentLanguage = event.target.value;

                localStorage.setItem(
                    "genshinLanguage",
                    currentLanguage
                );

                applyLanguage();
            });

        // ==============================
        // GitHub API
        // ==============================

        const API_BASE =
            `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents`;

        function getRawUrl(path) {
            const encodedPath = path
                .split("/")
                .map(part => encodeURIComponent(part))
                .join("/");

            return `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/${BRANCH_NAME}/${encodedPath}`;
        }

        async function getGitHubContents(path = "categories") {
            const url = `${API_BASE}/${path
                .split("/")
                .map(encodeURIComponent)
                .join("/")}?ref=${BRANCH_NAME}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("GitHub API Error");
            }

            return await response.json();
        }

        // ==============================
        // 顯示分類
        // ==============================

        async function loadCategories() {
            categoryList.innerHTML =
                `<div class="loading">${translations[currentLanguage].loading}</div>`;

            try {
                const folders = await getGitHubContents("categories");

                categoryList.innerHTML = "";

                const categories = folders.filter(item =>
                    item.type === "dir"
                );

                if (categories.length === 0) {
                    categoryList.textContent =
                        translations[currentLanguage].empty;
                    return;
                }

                categories.forEach(folder => {
                    const button = document.createElement("button");

                    button.className = "category-card";
                    button.textContent = folder.name;

                    button.addEventListener("click", () => {
                        loadFolder(folder.path);
                    });

                    categoryList.appendChild(button);
                });

            } catch (error) {
                categoryList.textContent =
                    translations[currentLanguage].error;
            }
        }

        // ==============================
        // 顯示分類圖片
        // ==============================

        async function loadFolder(path) {
            currentFolder = path.split("/").pop();

            gallerySection.classList.remove("hidden");
            document.querySelector(".category-section").classList.add("hidden");

            folderTitle.textContent = currentFolder;

            imageGrid.innerHTML =
                `<div class="loading">${translations[currentLanguage].loading}</div>`;

            try {
                const files = await getGitHubContents(path);

                imageGrid.innerHTML = "";

                const images = files.filter(file =>
                    file.type === "file" &&
                    /\.(png|jpe?g|gif|webp)$/i.test(file.name)
                );

                if (images.length === 0) {
                    imageGrid.textContent =
                        translations[currentLanguage].empty;
                    return;
                }

                images.forEach(file => {
                    const imageUrl = getRawUrl(file.path);

                    const card = document.createElement("div");
                    card.className = "image-card";

                    const image = document.createElement("img");
                    image.src = imageUrl;
                    image.alt = file.name;
                    image.loading = "lazy";

                    image.addEventListener("click", () => {
                        openImage(imageUrl);
                    });

                    card.appendChild(image);
                    imageGrid.appendChild(card);
                });

            } catch (error) {
                imageGrid.textContent =
                    translations[currentLanguage].error;
            }
        }

        // ==============================
        // 圖片預覽與下載
        // ==============================

        function openImage(url) {
            selectedImageUrl = url;
            modalImage.src = url;
            imageModal.classList.remove("hidden");
        }

        function closeImage() {
            imageModal.classList.add("hidden");
            modalImage.src = "";
        }

        document.getElementById("closeModal")
            .addEventListener("click", closeImage);

        imageModal.addEventListener("click", event => {
            if (event.target === imageModal) {
                closeImage();
            }
        });

        document.getElementById("downloadBtn")
            .addEventListener("click", () => {
                if (!selectedImageUrl) return;

                const shortcutLink =
                    `${SHORTCUT_URL}?url=${encodeURIComponent(selectedImageUrl)}`;

                window.location.href = shortcutLink;
            });

        // ==============================
        // 返回分類
        // ==============================

        document.getElementById("backBtn")
            .addEventListener("click", () => {
                currentFolder = "";

                gallerySection.classList.add("hidden");
                document.querySelector(".category-section")
                    .classList.remove("hidden");
            });

        // ==============================
        // 頂部按鈕
        // ==============================

        document.getElementById("shortcutBtn")
            .addEventListener("click", () => {
                window.open(SHORTCUT_URL, "_blank");
            });

        document.getElementById("guideBtn")
            .addEventListener("click", () => {
                showToast("guide.png");
            });

        document.getElementById("homeBtn")
            .addEventListener("click", () => {
                showToast(
                    currentLanguage === "en"
                        ? "Use your browser menu to add this page to your home screen."
                        : "請使用瀏覽器選單將網頁加入主畫面"
                );
            });

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        // ==============================
        // 初始化
        // ==============================

        applyLanguage();
        loadCategories();
    </script>
</body>
</html>
