
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="原神表情包">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <title>原神專屬表情包庫</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, sans-serif;
      background: #14161f;
      color: #f3e5c8;
      margin: 0;
      padding: calc(16px + env(safe-area-inset-top)) 12px 110px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #9aa0b8;
      margin: 0 0 10px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .action-pill {
      background: #252a3c;
      color: #f3e5c8;
      border: 1px solid #d3bc8e;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .filter-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      position: sticky;
      top: 8px;
      z-index: 50;
      background: rgba(20, 22, 31, 0.92);
      padding: 6px 0;
    }

    .search-input,
    .folder-select {
      background: #1e2230;
      color: #f3e5c8;
      border: 1.5px solid #d3bc8e;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
    }

    .search-input {
      width: 40%;
    }

    .folder-select {
      width: 60%;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      position: relative;
      background: #1e2230;
      border-radius: 14px;
      aspect-ratio: 1;
      overflow: hidden;
      border: 2.5px solid #2c3246;
      cursor: pointer;
    }

    .card.selected {
      border-color: #d3bc8e;
      background: #282d40;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
      display: block;
    }

    .check-circle {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(20, 22, 31, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card.selected .check-circle {
      background: #d3bc8e;
      border-color: #d3bc8e;
    }

    .check-circle::after {
      content: "✓";
      color: #14161f;
      font-size: 14px;
      font-weight: 900;
      opacity: 0;
    }

    .card.selected .check-circle::after {
      opacity: 1;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      padding: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      border: 2px solid #d3bc8e;
    }

    .modal-close {
      margin-top: 16px;
      background: #d3bc8e;
      color: #14161f;
      padding: 10px 28px;
      border-radius: 20px;
      font-weight: bold;
      border: none;
      font-size: 15px;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #9aa0b8;
      padding: 40px 10px;
      font-size: 14px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(24, 27, 38, 0.95);
      border-top: 1px solid #2c3246;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .select-info {
      font-size: 14px;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.35;
    }

    .btn-clear {
      background: #2c3246;
      color: #ccc;
    }

    .btn-download {
      background: #d3bc8e;
      color: #14161f;
    }
  </style>
</head>

<body>

  <header>
    <h1>✦ 原神表情包圖庫 ✦</h1>
    <p class="subtitle" id="totalCount">正在載入分類資料夾...</p>

    <div class="top-actions">
      <div class="action-pill" onclick="openModal('install.png')">
        📲 1.變成桌面App
      </div>

      <a id="installShortcutLink" class="action-pill" href="#" target="_blank">
        ⚡ 2.安裝接收捷徑
      </a>

      <div class="action-pill" onclick="openModal('guide.png')">
        📖 3.看貼圖教學
      </div>
    </div>
  </header>

  <div class="filter-box">
    <input
      type="text"
      id="folderSearch"
      class="search-input"
      placeholder="🔍 搜畫作輯數..."
      oninput="filterFolderOptions()"
    >

    <select
      id="folderSelect"
      class="folder-select"
      onchange="loadImagesInFolder(this.value)"
    >
      <option value="">載入分類中...</option>
    </select>
  </div>

  <main class="grid" id="gallery">
    <div class="status-msg">資料載入中...</div>
  </main>

  <div class="modal" id="guideModal" onclick="closeModal()">
    <img
      id="modalImage"
      src=""
      alt="使用教學"
      onclick="event.stopPropagation()"
    >
    <button class="modal-close" onclick="closeModal()">我知道了</button>
  </div>

  <footer class="bottom-bar">
    <span class="select-info" id="selectedCount">已選 0 張</span>

    <div class="btn-group">
      <button
        class="btn-clear"
        id="clearBtn"
        disabled
        onclick="clearSelection()"
      >
        取消全選
      </button>

      <button
        class="btn-download"
        id="downloadBtn"
        disabled
        onclick="downloadSelected()"
      >
        下載到相片
      </button>
    </div>
  </footer>

  <script>
    // ==============================
    // 基本設定
    // ==============================

    const SHORTCUT_ICLOUD_URL =
      "https://www.icloud.com/shortcuts/a10230967640433298104f5360eb4fdb";

    const ROOT_FOLDER = "categories";
    const GITHUB_USERNAME = "cxuan7701-rgb";
    const REPO_NAME = "genshin-stickers";
    const SHORTCUT_NAME = "一鍵下載貼圖";

    const BRANCH_NAME = "main";

    document.getElementById("installShortcutLink").href =
      SHORTCUT_ICLOUD_URL;

    const selectedUrls = new Set();

    let allFolders = [];

    const galleryEl = document.getElementById("gallery");
    const folderSelectEl = document.getElementById("folderSelect");


    // ==============================
    // 共用功能
    // ==============================

    function updateSelectionUI() {
      document.getElementById("selectedCount").innerText =
        `已選 ${selectedUrls.size} 張`;

      const disabled = selectedUrls.size === 0;

      document.getElementById("clearBtn").disabled = disabled;
      document.getElementById("downloadBtn").disabled = disabled;
    }


    function openModal(fileName) {
      document.getElementById("modalImage").src = fileName;
      document.getElementById("guideModal").classList.add("show");
    }


    function closeModal() {
      document.getElementById("guideModal").classList.remove("show");
    }


    function getApiBase() {
      return `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${ROOT_FOLDER}`;
    }


    // ==============================
    // 修正重點：建立完整圖片網址
    // ==============================

    function getImageUrl(filePath) {
      const encodedPath = filePath
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

      return `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/${BRANCH_NAME}/${encodedPath}`;
    }


    // ==============================
    // 讀取分類資料夾
    // ==============================

    async function fetchFolderList() {
      try {
        const res = await fetch(getApiBase());

        if (!res.ok) {
          throw new Error(
            `找不到 ${ROOT_FOLDER} 資料夾，請確認 GitHub 設定。`
          );
        }

        const items = await res.json();

        allFolders = items
          .filter(item => item.type === "dir")
          .map(folder => folder.name);

        if (allFolders.length === 0) {
          galleryEl.innerHTML =
            `<div class="status-msg">${ROOT_FOLDER} 裡面還沒有小資料夾喔！</div>`;
          return;
        }

        renderFolderDropdown(allFolders);

        loadImagesInFolder(allFolders[0]);

      } catch (e) {
        galleryEl.innerHTML =
          `<div class="status-msg">⚠️ ${e.message}</div>`;
      }
    }


    function renderFolderDropdown(folders) {
      folderSelectEl.innerHTML = "";

      folders.forEach(name => {
        const opt = document.createElement("option");

        opt.value = name;
        opt.innerText = `📁 ${name}`;

        folderSelectEl.appendChild(opt);
      });
    }


    function filterFolderOptions() {
      const kw = document
        .getElementById("folderSearch")
        .value
        .trim()
        .toLowerCase();

      const filtered = allFolders.filter(name =>
        name.toLowerCase().includes(kw)
      );

      renderFolderDropdown(filtered);

      if (filtered.length > 0) {
        loadImagesInFolder(filtered[0]);
      } else {
        galleryEl.innerHTML =
          `<div class="status-msg">找不到符合的分類喔！</div>`;
      }
    }


    // ==============================
    // 讀取圖片
    // ==============================

    async function loadImagesInFolder(folderName) {
      if (!folderName) return;

      galleryEl.innerHTML =
        `<div class="status-msg">正在讀取「${folderName}」...</div>`;

      const apiUrl =
        `${getApiBase()}/${encodeURIComponent(folderName)}`;

      try {
        const res = await fetch(apiUrl);

        if (!res.ok) {
          throw new Error("無法讀取資料夾內容");
        }

        const files = await res.json();

        const imgs = files.filter(file =>
          file.type === "file" &&
          /\.(png|jpe?g|gif|webp)$/i.test(file.name)
        );

        galleryEl.innerHTML = "";

        document.getElementById("totalCount").innerText =
          `共 ${allFolders.length} 輯 ｜ 本輯共 ${imgs.length} 張`;

        if (imgs.length === 0) {
          galleryEl.innerHTML =
            `<div class="status-msg">這個分類目前沒有圖片喔！</div>`;
          return;
        }

        imgs.forEach(file => {

          // 使用 GitHub 回傳的完整檔案路徑
          const imageUrl = getImageUrl(file.path);

          const card = document.createElement("div");

          card.className =
            "card" + (selectedUrls.has(imageUrl) ? " selected" : "");

          const img = document.createElement("img");

          img.src = imageUrl;
          img.loading = "lazy";
          img.alt = file.name;

          const check = document.createElement("div");
          check.className = "check-circle";

          card.appendChild(img);
          card.appendChild(check);

          card.onclick = () => {

            if (selectedUrls.has(imageUrl)) {
              selectedUrls.delete(imageUrl);
              card.classList.remove("selected");

            } else {
              selectedUrls.add(imageUrl);
              card.classList.add("selected");
            }

            updateSelectionUI();
          };

          galleryEl.appendChild(card);
        });

        updateSelectionUI();

      } catch (e) {
        galleryEl.innerHTML =
          `<div class="status-msg">⚠️ ${e.message}</div>`;
      }
    }


    // ==============================
    // 取消選取
    // ==============================

    function clearSelection() {
      selectedUrls.clear();

      document
        .querySelectorAll(".card.selected")
        .forEach(card => card.classList.remove("selected"));

      updateSelectionUI();
    }


    // ==============================
    // 下載到 iPhone 相片
    // ==============================

    function downloadSelected() {
      if (selectedUrls.size === 0) return;

      const safeUrls = Array.from(selectedUrls);

      const urlList = safeUrls.join("\n");

      const shortcutUrl =
        `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}` +
        `&input=text&text=${encodeURIComponent(urlList)}`;

      window.location.href = shortcutUrl;
    }


    // ==============================
    // 啟動
    // ==============================

    fetchFolderList();

  </script>

</body>
</html>
