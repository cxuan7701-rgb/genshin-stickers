
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151821">
  <title>派蒙的畫作</title>

  <link rel="stylesheet" href="style.css">

  <!-- 網站分頁 Icon -->
  <link rel="icon" type="image/png" href="./icon.png">

  <!-- iPhone 主畫面 Icon -->
  <link rel="apple-touch-icon" href="./icon.png">
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="header-top">
        <div class="logo-area">
          <h1 id="pageTitle">派蒙的畫作</h1>
          <p id="pageSubtitle">原神貼圖收藏</p>
        </div>

        <select id="languageSelect" class="language-select" aria-label="Language">
          <option value="zh-TW">繁體中文</option>
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>

      <nav class="top-buttons">

        <!-- 桌面 App：開啟 install.png 彈窗 -->
        <button class="top-button" id="desktopAppButton" type="button">
          桌面 App
        </button>

        <!-- 安裝捷徑 -->
        <a
          class="top-button"
          href="https://www.icloud.com/shortcuts/c7d92ded99d348339807fd89d406add5"
          target="_blank"
          rel="noopener"
          id="installShortcutButton"
        >安裝捷徑</a>

        <!-- 貼圖教學 -->
        <button class="top-button" id="guideButton" type="button">
          <span id="guideButtonText">貼圖教學</span>
        </button>

      </nav>
    </header>

    <main>
      <section class="toolbar">
        <div class="category-area">
          <label for="categorySelect" id="categoryLabel">選擇系列</label>
          <select id="categorySelect">
            <option value="">載入中...</option>
          </select>
        </div>
      </section>

      <section class="gallery-heading">
        <div>
          <h2 id="currentFolderTitle">載入中...</h2>
          <p id="imageCount">0 張貼圖</p>
        </div>

        <button id="refreshButton" class="refresh-button" type="button">
          <span id="refreshButtonText">重新整理</span>
        </button>
      </section>

      <div id="loadingMessage" class="message">
        正在載入貼圖...
      </div>

      <div id="errorMessage" class="message error-message hidden"></div>

      <section id="imageGrid" class="image-grid"></section>

      <div id="emptyMessage" class="message hidden">
        找不到貼圖
      </div>
    </main>

    <footer class="selection-bar">
      <div class="selection-info">
        <span id="selectedLabel">已選取</span>
        <strong id="selectedCount">0</strong>
        <span id="selectedUnit">張</span>
      </div>

      <div class="selection-actions">
        <button id="selectAllButton" class="action-button secondary" type="button">
          一鍵全選
        </button>

        <button id="clearSelectionButton" class="action-button secondary" type="button">
          取消全選
        </button>

        <button id="downloadButton" class="action-button primary" type="button" disabled>
          確定下載
        </button>
      </div>
    </footer>

  </div>

  <!-- =========================
       桌面 App 彈窗
       顯示 install.png
  ========================= -->

  <div id="installModal" class="modal hidden">
    <div class="modal-backdrop" id="installBackdrop"></div>

    <div class="modal-content">
      <button
        class="modal-close"
        id="closeInstallButton"
        type="button"
        aria-label="關閉"
      >×</button>

      <h2 id="installTitle">桌面 App 安裝教學</h2>

      <img
        src="./install.png"
        alt="桌面 App 安裝教學"
        id="installImage"
      >
    </div>
  </div>

  <!-- =========================
       貼圖教學彈窗
       顯示 guide.png
  ========================= -->

  <div id="guideModal" class="modal hidden">
    <div class="modal-backdrop" id="guideBackdrop"></div>

    <div class="modal-content">
      <button
        class="modal-close"
        id="closeGuideButton"
        type="button"
        aria-label="關閉"
      >×</button>

      <h2 id="guideTitle">貼圖下載教學</h2>

      <p id="guideDescription">
        選取想下載的貼圖，再按下確定下載即可。
      </p>

      <img
        src="./guide.png"
        alt="貼圖下載教學"
        id="guideImage"
      >
    </div>
  </div>

  <script>
    /* =========================
       GitHub 設定
    ========================= */

    const GITHUB_USERNAME = "cxuan7701-rgb";
    const REPO_NAME = "genshin-stickers";
    const BRANCH_NAME = "main";
    const CATEGORY_FOLDER = "categories";
    const SHORTCUT_NAME = "一鍵下載貼圖";

    const translations = {
      "zh-TW": {

      "zh-CN": {

        pageSubtitle: "原神贴图收藏",

      en: {

        guideButton: "Guide",

        loadingCategories: "Loading series...",
        noImages: "There are no stickers in this series.",
        imageCount: "stickers",
        selectedLabel: "Selected",
        selectedUnit: "",
        selectAll: "Select All",
        clearSelection: "Clear Selection",
        download: "Confirm Download",
        refresh: "Refresh",
        guideTitle: "Download Guide",
        guideDescription: "Select the stickers you want, then press Confirm Download.",
        loadError: "Failed to load. Please try again later.",
        noSelection: "Please select some stickers first.",
        confirmDownload: "Download the {count} selected stickers?",
        downloadError: "Unable to open the shortcut. Please check that it is installed.",
        series: "Paimon's Artwork Vol. 1"
      },

      ja: {
        pageTitle: "パイモンの作品",
        pageSubtitle: "原神スタンプコレクション",
        desktopApp: "デスクトップ App",
        installTitle: "デスクトップ App インストールガイド",
        installShortcut: "ショートカットをインストール",
        guideButton: "使い方",
        categoryLabel: "シリーズを選択",
        loading: "スタンプを読み込み中...",
        loadingCategories: "シリーズを読み込み中...",
        noImages: "このシリーズにはスタンプがありません。",
        imageCount: "枚",
        selectedLabel: "選択中",
        selectedUnit: "枚",
        selectAll: "すべて選択",
        clearSelection: "選択を解除",
        download: "ダウンロードを確定",
        refresh: "更新",
        guideTitle: "ダウンロード方法",
        guideDescription: "ダウンロードしたいスタンプを選択して、確定ボタンを押してください。",
        loadError: "読み込みに失敗しました。もう一度お試しください。",
        noSelection: "先にスタンプを選択してください。",
        confirmDownload: "選択した {count} 枚のスタンプをダウンロードしますか？",
        downloadError: "ショートカットを開けません。インストールされているか確認してください。",
        series: "パイモンの作品 第1弾"
      },

      ko: {
        pageTitle: "페이몬의 그림",
        pageSubtitle: "원신 스티커 컬렉션",
        desktopApp: "데스크톱 App",
        installTitle: "데스크톱 App 설치 안내",
        installShortcut: "단축어 설치",
        guideButton: "사용 방법",
        categoryLabel: "시리즈 선택",
        loading: "스티커를 불러오는 중...",
        loadingCategories: "시리즈를 불러오는 중...",
        noImages: "이 시리즈에는 스티커가 없습니다.",
        imageCount: "장",
        selectedLabel: "선택됨",
        selectedUnit: "장",
        selectAll: "모두 선택",
        clearSelection: "선택 취소",
        download: "다운로드 확인",
        refresh: "새로고침",
        guideTitle: "다운로드 방법",
        guideDescription: "원하는 스티커를 선택한 다음 다운로드 확인을 누르세요.",
        loadError: "불러오기에 실패했습니다. 잠시 후 다시 시도하세요.",
        noSelection: "먼저 스티커를 선택하세요.",
        confirmDownload: "선택한 스티커 {count}장을 다운로드할까요?",
        downloadError: "단축어를 열 수 없습니다. 단축어가 설치되어 있는지 확인하세요.",
        series: "페이몬의 그림 제1집"
      }
    };

    let currentLanguage =
      localStorage.getItem("genshinLanguage") || "zh-TW";

    let allFolders = [];
    let currentFolder = null;
    let currentImages = [];

    const selectedUrls = new Set();

    const languageSelect = document.getElementById("languageSelect");
    const categorySelect = document.getElementById("categorySelect");
    const imageGrid = document.getElementById("imageGrid");
    const loadingMessage = document.getElementById("loadingMessage");
    const errorMessage = document.getElementById("errorMessage");
    const emptyMessage = document.getElementById("emptyMessage");
    const currentFolderTitle = document.getElementById("currentFolderTitle");
    const imageCount = document.getElementById("imageCount");
    const selectedCount = document.getElementById("selectedCount");
    const downloadButton = document.getElementById("downloadButton");

    const guideModal = document.getElementById("guideModal");
    const installModal = document.getElementById("installModal");

    function t(key) {
      return translations[currentLanguage]?.[key]
        ?? translations["zh-TW"][key]
        ?? key;
    }

    /* =========================
       系列名稱
    ========================= */

    function getSeriesName(index) {
      const number = index + 1;

      const names = {
        "zh-TW": `派蒙的畫作 第${number}輯`,
        "zh-CN": `派蒙的画作 第${number}辑`,
        en: `Paimon's Artwork Vol. ${number}`,
        ja: `パイモンの作品 第${number}弾`,
        ko: `페이몬의 그림 제${number}집`
      };

      return names[currentLanguage] || names["zh-TW"];
    }

    /* =========================
       語言切換
    ========================= */

    function applyLanguage() {
      document.documentElement.lang = currentLanguage;

      document.getElementById("pageTitle").textContent = t("pageTitle");
      document.getElementById("pageSubtitle").textContent = t("pageSubtitle");
      document.getElementById("desktopAppButton").textContent = t("desktopApp");
      document.getElementById("installShortcutButton").textContent = t("installShortcut");
      document.getElementById("guideButtonText").textContent = t("guideButton");
      document.getElementById("categoryLabel").textContent = t("categoryLabel");
      document.getElementById("selectedLabel").textContent = t("selectedLabel");
      document.getElementById("selectedUnit").textContent = t("selectedUnit");
      document.getElementById("selectAllButton").textContent = t("selectAll");
      document.getElementById("clearSelectionButton").textContent = t("clearSelection");

      document.getElementById("installTitle").textContent = t("installTitle");
      document.getElementById("guideTitle").textContent = t("guideTitle");
      document.getElementById("guideDescription").textContent = t("guideDescription");

      downloadButton.textContent = t("download");
      document.getElementById("refreshButtonText").textContent = t("refresh");

      document.title = t("pageTitle");

      renderCategoryOptions();
      updateFolderTitle();
      renderImages();
      updateSelectedCount();
    }

    languageSelect.value = currentLanguage;

    languageSelect.addEventListener("change", () => {
      currentLanguage = languageSelect.value;
      localStorage.setItem("genshinLanguage", currentLanguage);
      applyLanguage();
    });

    /* =========================
       GitHub API
    ========================= */

    async function getGitHubContents(path) {
      const url =
        `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${path}?ref=${BRANCH_NAME}`;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`GitHub API Error: ${response.status}`);
      }

      return await response.json();
    }

    function getRawUrl(path) {
      const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

      return `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/${BRANCH_NAME}/${encodedPath}`;
    }

    /* =========================
       系列資料夾
    ========================= */

    async function loadCategories() {
      loadingMessage.textContent = t("loadingCategories");
      loadingMessage.classList.remove("hidden");
      errorMessage.classList.add("hidden");

      try {
        const contents = await getGitHubContents(CATEGORY_FOLDER);

        allFolders = contents
          .filter(item => item.type === "dir")
          .sort((a, b) =>
            a.name.localeCompare(b.name, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        if (allFolders.length === 0) {
          categorySelect.innerHTML = "";
          currentFolder = null;
          currentImages = [];
          imageGrid.innerHTML = "";

          loadingMessage.classList.add("hidden");

          emptyMessage.textContent = t("noImages");
          emptyMessage.classList.remove("hidden");

          currentFolderTitle.textContent = "";
          imageCount.textContent = `0 ${t("imageCount")}`;
          return;
        }

        renderCategoryOptions();

        currentFolder = allFolders[0];
        categorySelect.value = currentFolder.path;

        updateFolderTitle();
        await loadImagesInFolder(currentFolder);

      } catch (error) {
        console.error(error);

        loadingMessage.classList.add("hidden");
        errorMessage.textContent = t("loadError");
        errorMessage.classList.remove("hidden");
      }
    }

    function renderCategoryOptions() {
      categorySelect.innerHTML = "";

      allFolders.forEach((folder, index) => {
        const option = document.createElement("option");

        option.value = folder.path;
        option.textContent = getSeriesName(index);

        categorySelect.appendChild(option);
      });

      if (currentFolder) {
        categorySelect.value = currentFolder.path;
      }
    }

    function updateFolderTitle() {
      if (!currentFolder) {
        currentFolderTitle.textContent = "";
        return;
      }

      const index = allFolders.findIndex(
        folder => folder.path === currentFolder.path
      );

      currentFolderTitle.textContent = getSeriesName(index);
    }

    /* =========================
       圖片載入
    ========================= */

    async function loadImagesInFolder(folder) {
      if (!folder) return;

      currentFolder = folder;
      updateFolderTitle();

      loadingMessage.textContent = t("loading");
      loadingMessage.classList.remove("hidden");

      errorMessage.classList.add("hidden");
      emptyMessage.classList.add("hidden");
      imageGrid.innerHTML = "";

      try {
        const contents = await getGitHubContents(folder.path);

        currentImages = contents
          .filter(item =>
            item.type === "file" &&
            /\.(png|jpe?g|gif|webp|avif)$/i.test(item.name)
          )
          .sort((a, b) =>
            a.name.localeCompare(b.name, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        loadingMessage.classList.add("hidden");
        renderImages();

      } catch (error) {
        console.error(error);

        loadingMessage.classList.add("hidden");
        errorMessage.textContent = t("loadError");
        errorMessage.classList.remove("hidden");
      }
    }

    /* =========================
       圖片顯示
    ========================= */

    function renderImages() {
      imageGrid.innerHTML = "";

      imageCount.textContent =
        `${currentImages.length} ${t("imageCount")}`;

      if (currentImages.length === 0) {
        emptyMessage.textContent = t("noImages");
        emptyMessage.classList.remove("hidden");
        return;
      }

      emptyMessage.classList.add("hidden");

      currentImages.forEach(file => {
        const imageUrl = getRawUrl(file.path);
        const isSelected = selectedUrls.has(imageUrl);

        const card = document.createElement("button");
        card.type = "button";
        card.className = "image-card";

        if (isSelected) {
          card.classList.add("selected");
        }

        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = "Genshin sticker";
        image.loading = "lazy";

        const checkmark = document.createElement("span");
        checkmark.className = "checkmark";
        checkmark.textContent = "✓";

        card.appendChild(image);
        card.appendChild(checkmark);

        card.addEventListener("click", () => {
          toggleImageSelection(imageUrl, card);
        });

        imageGrid.appendChild(card);
      });
    }

    /* =========================
       選取功能
    ========================= */

    function toggleImageSelection(imageUrl, card) {
      if (selectedUrls.has(imageUrl)) {
        selectedUrls.delete(imageUrl);
        card.classList.remove("selected");
      } else {
        selectedUrls.add(imageUrl);
        card.classList.add("selected");
      }

      updateSelectedCount();
    }

    function updateSelectedCount() {
      selectedCount.textContent = selectedUrls.size;
      downloadButton.disabled = selectedUrls.size === 0;
    }

    /* =========================
       一鍵全選
    ========================= */

    function selectAllCurrentImages() {
      currentImages.forEach(file => {
        selectedUrls.add(getRawUrl(file.path));
      });

      renderImages();
      updateSelectedCount();
    }

    /* =========================
       取消全選
    ========================= */

    function clearSelection() {
      selectedUrls.clear();

      renderImages();
      updateSelectedCount();
    }

    /* =========================
       下載功能
    ========================= */

    function downloadSelected() {
      if (selectedUrls.size === 0) {
        alert(t("noSelection"));
        return;
      }

      const urls = Array.from(selectedUrls);

      const message = t("confirmDownload")
        .replace("{count}", urls.length);

      if (!confirm(message)) {
        return;
      }

      const text = encodeURIComponent(urls.join("\n"));

      const shortcutUrl =
        `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=${text}`;

      window.location.href = shortcutUrl;
    }

    /* =========================
       分類切換
    ========================= */

    categorySelect.addEventListener("change", async () => {
      const folder = allFolders.find(
        item => item.path === categorySelect.value
      );

      if (folder) {
        await loadImagesInFolder(folder);
      }
    });

    /* =========================
       功能按鈕事件
    ========================= */

    document
      .getElementById("selectAllButton")
      .addEventListener("click", selectAllCurrentImages);

    document
      .getElementById("clearSelectionButton")
      .addEventListener("click", clearSelection);

    downloadButton.addEventListener("click", downloadSelected);

    document
      .getElementById("refreshButton")
      .addEventListener("click", loadCategories);

    /* =========================
       桌面 App 彈窗
    ========================= */

    document
      .getElementById("desktopAppButton")
      .addEventListener("click", () => {
        installModal.classList.remove("hidden");
      });

    document
      .getElementById("closeInstallButton")
      .addEventListener("click", () => {
        installModal.classList.add("hidden");
      });

    document
      .getElementById("installBackdrop")
      .addEventListener("click", () => {
        installModal.classList.add("hidden");
      });

    /* =========================
       貼圖教學彈窗
    ========================= */

    document
      .getElementById("guideButton")
      .addEventListener("click", () => {
        guideModal.classList.remove("hidden");
      });

    document
      .getElementById("closeGuideButton")
      .addEventListener("click", () => {
        guideModal.classList.add("hidden");
      });

    document
      .getElementById("guideBackdrop")
      .addEventListener("click", () => {
        guideModal.classList.add("hidden");
      });

    /* =========================
       按下 ESC 關閉彈窗
    ========================= */

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        installModal.classList.add("hidden");
        guideModal.classList.add("hidden");
      }
    });

    /* =========================
       啟動
    ========================= */

    applyLanguage();
    updateSelectedCount();
    loadCategories();

  </script>
</body>
</html>
